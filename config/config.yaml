# RedHouse Home Automation Configuration
# This file is committed to git - do NOT put secrets or PII here.
# Secrets and PII go in .env (not committed).
# Sensor mapping goes in config/sensors.yaml (not committed).

heating:
  # Heating curve: outdoor temperature (C) -> hours to heat per day
  curve:
    -20: 12
    0: 6
    16: 2

  # EVU off (hot water heating blocked) configuration
  # threshold is total price in EUR/kWh (including transfer + tax)
  evuoff_threshold_price: 0.40
  evuoff_max_continuous_hours: 4

  # The longest stretch without pump ON, also across midnight (design 12)
  max_off_h: 8

garage:
  # One heater per relay: .185 drives 1.07 kW on L3, .186 1.06 kW on L1
  relay_urls: [http://192.168.1.185/relay/0, http://192.168.1.186/relay/0]
  heater_kw: [1.07, 1.06]
  sensor_name: Autotalli
  sensor_status_file: data/shelly_ht_status.json
  target_c: 5.0
  floor_c: 2.0
  stale_after_s: 10800
  # An OFF turns the relay back ON after this, so a dead controller fails ON
  off_timer_s: 4500
  # Pessimistic model, checked against three winters of history
  loss_k_per_h_per_k: 0.010
  loss_k_per_h: 0.08
  heat_gross_k_per_h: 0.6

power_cap:
  # Helen: the month's third-highest hourly import, 22-07 local at 80 %
  night_factor: 0.8
  night_start_hour: 22
  night_end_hour: 7
  month_floor_kw: 7.5
  plan_margin_kw: 0.3
  guard_margin_kw: 0.1
  tariff_eur_per_kw: 1.97
  # 3 x 50 A main fuse at 230 V: a bigger counter step is a reset or a glitch
  max_import_kw: 34.5

load_budget:
  # Moves pump ON hours that would not fit under the month's cap
  enabled: true
  base_kw: 1.6
  battery_allowance_kw: 1.5
  pump_on_kw: 3.4
  # Saturday 17-22 local; a :30 to :30 session puts half of it in an hour
  sauna_kw: 7.0
  sauna_share: 0.5
  sauna_weekdays: [5]
  sauna_start_hour: 17
  sauna_end_hour: 22

car_tip:
  # 45 kWh before 07:00; a mail only when it saves 1 EUR against charging
  # at once from plug_in_hour, power charge included. Other load: load_budget
  session_kwh: 45
  kw_low: 5.5
  kw_high: 11.2
  deadline_hour: 7
  plug_in_hour: 17
  min_saving_eur: 1.0

load_guard:
  # dry_run logs what it would shed; act sheds (staging: mocks only)
  mode: act
  # The compressor above the base load; the guard never uses EVU
  pump_ale_kw: 3.0

hot_water:
  # The circulation pump relay (Shelly 1 Gen1); never the ventilation .5
  relay_url: http://192.168.1.188/relay/0
  # Every ON carries this auto-off timer, so a stopped tick leaves it OFF
  relay_on_timer_s: 180
  manual_on_keep_s: 1800
  manual_off_suspend_s: 1800
  circulate_max_min: 60
  tank_top_field: "Käyttövesi ylh"
  tank_bottom_field: "Käyttövesi alh"
  data_stale_s: 300
  # Pump display settings; the bottom sensor reads about 0.7 C over the start
  pump_start_setting_c: 42.0
  start_offset_c: 0.7
  hot_water_time_min: 20
  floor_c: 38.0
  # off, dry_run or act; the cutover table of design 10 (a test checks it)
  modes:
    relay_default: act
    boost_trigger: dry_run
    flush: dry_run
    preheat: dry_run
    pre_on: dry_run
    comfort: "off"
  boost:
    # Pump restart Fri 2026-11-27 22:00 local; hotwater anchor overrides it
    anchor_utc: "2026-11-27T20:00:00Z"
    interval_days: 14
    slot_minutes: 180
    trigger_attempt_min: 30
    retry_gap_min: 30
    unexpected_after_h: 36
  flush: {start_c: 65.0, minutes: 45}
  preheat: {price_c_kwh: 20.0, horizon_h: 12, reach_c: 2.0}
  pre_on: {lead_min: 20, max_extra_c_kwh: 3.0}
  comfort: {minutes: 15, price_c_kwh: 15.0, slots: {fri: "21:40", sat: "19:30", other: "21:00"}}
  alerts: {start_drift_c: 1.0}
  # The boost's heater in the hour budget, on with the boost trigger's act
  boost_budget: false
  boost_kw: 6.5
  planner_link: false

pump_health:
  # Pump ON and no compressor or heater this long: the high-pressure alarm
  no_step_min: 90
  below_outdoor_c: 8.0

hardware:
  pump_i2c_bus: 1
  pump_i2c_address: 0x10
  shelly_relay_url: http://192.168.1.5
  shelly_em3_url: http://192.168.1.5

data_collection:
  temperature:
    interval_minutes: 1
    retry_attempts: 20
    identical_readings_required: 3
    backup_identical_readings: 2
    exclude_sensors:
      - "e9"

  spot_prices:
    value_added_tax: 1.255
    sellers_margin: 0.50
    production_buyback_margin: 0.24
    transfer_day_price: 2.96
    transfer_night_price: 1.56
    transfer_tax_price: 2.9179

scheduling:
  generate_program_time: "16:05"
  execute_program_interval_minutes: 15
  mlp_evu_cycle_interval_hours: 2

logging:
  level: INFO
  dir: /var/log/redhouse
  max_bytes: 10485760
  backup_count: 5
