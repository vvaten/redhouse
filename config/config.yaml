# RedHouse Home Automation Configuration
# This file is committed to git - do NOT put secrets or PII here.
# Secrets and PII go in .env (not committed).
# Sensor mapping goes in config/sensors.yaml (not committed).

heating:
  # Heating curve: outdoor temperature (C) -> hours to heat per day
  curve:
    -20: 12
    0: 6
    16: 2

  # EVU off (hot water heating blocked) configuration
  # threshold is total price in EUR/kWh (including transfer + tax)
  evuoff_threshold_price: 0.40
  evuoff_max_continuous_hours: 4

garage:
  # One heater per relay: .185 drives 1.07 kW on L3, .186 1.06 kW on L1
  relay_urls: [http://192.168.1.185/relay/0, http://192.168.1.186/relay/0]
  heater_kw: [1.07, 1.06]
  sensor_name: Autotalli
  sensor_status_file: data/shelly_ht_status.json
  target_c: 5.0
  floor_c: 2.0
  stale_after_s: 10800
  # An OFF turns the relay back ON after this, so a dead controller fails ON
  off_timer_s: 4500
  # Pessimistic model, checked against three winters of history
  loss_k_per_h_per_k: 0.010
  loss_k_per_h: 0.08
  heat_gross_k_per_h: 0.6

power_cap:
  # Helen: the month's third-highest hourly import, 22-07 local at 80 %
  night_factor: 0.8
  night_start_hour: 22
  night_end_hour: 7
  month_floor_kw: 7.5
  plan_margin_kw: 0.3
  guard_margin_kw: 0.1
  tariff_eur_per_kw: 1.97
  # 3 x 50 A main fuse at 230 V: a bigger counter step is a reset or a glitch
  max_import_kw: 34.5

hardware:
  pump_i2c_bus: 1
  pump_i2c_address: 0x10
  shelly_relay_url: http://192.168.1.5
  shelly_em3_url: http://192.168.1.5

data_collection:
  temperature:
    interval_minutes: 1
    retry_attempts: 20
    identical_readings_required: 3
    backup_identical_readings: 2
    exclude_sensors:
      - "e9"

  spot_prices:
    value_added_tax: 1.255
    sellers_margin: 0.50
    production_buyback_margin: 0.24
    transfer_day_price: 2.96
    transfer_night_price: 1.56
    transfer_tax_price: 2.9179

scheduling:
  generate_program_time: "16:05"
  execute_program_interval_minutes: 15
  mlp_evu_cycle_interval_hours: 2

logging:
  level: INFO
  dir: /var/log/redhouse
  max_bytes: 10485760
  backup_count: 5
