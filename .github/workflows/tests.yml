name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Pinned: setup-python has no Python 3.9, the Pi's version, for 26.04
    runs-on: ubuntu-24.04
    strategy:
      # One failing version must not cancel the others' results
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short

  lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        # Take the versions from requirements.txt so CI and local agree.
        # Unpinned, black reached 26.5.1 and failed 12 builds on two
        # files nobody had touched since September 14.
        pip install "$(grep -E '^black==' requirements.txt)" \
                    "$(grep -E '^ruff==' requirements.txt)"

    - name: Check code formatting with black
      run: |
        black --check --diff src/ tests/

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

  secrets:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        # The whole history: a secret committed once stays in it
        fetch-depth: 0

    - name: Install gitleaks
      env:
        VERSION: 8.21.2
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
        archive="gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "$archive" "$base/$archive"
        curl -sSfL -o checksums.txt "$base/gitleaks_${VERSION}_checksums.txt"
        grep " ${archive}\$" checksums.txt | sha256sum -c -
        tar -xzf "$archive" gitleaks

    - name: Scan the whole history for secrets
      run: |
        ./gitleaks git --redact --no-banner \
          --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore
